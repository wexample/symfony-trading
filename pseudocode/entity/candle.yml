items:
  - name: Candle
    type: class
    description: "One bar of a market: its open, high, low and close over a timeframe.\nAn entity without an ORM mapping — a candle is read when it is asked for,\nfrom whatever the application stores its bars in — so that a market chart\ntravels the road every list of the stack travels: normalizer, dto,\ngenerated `Candle.ts` and its repository, which the market chart reads."
    properties:
      - name: id
        type: Symfony\Component\Uid\Uuid
      - name: chart
        type: string
      - name: time
        type: int
      - name: open
        type: float
      - name: high
        type: float
      - name: low
        type: float
      - name: close
        type: float
      - name: volume
        type: float
        nullable: true
        default: null
    methods:
      - type: method
        name: buildEntityPath
        parameters:
          - type: string
            name: className
        return:
          type: string
      - type: method
        name: getEntityKeyName
        return:
          type: string
      - type: method
        name: getEntityShortName
        return:
          type: string
      - type: method
        name: getId
        return:
          type: Symfony\Component\Uid\Uuid
      - type: method
        name: setId
        parameters:
          - type: Symfony\Component\Uid\Uuid
            name: id
        return:
          type: void
      - type: method
        name: getTableizedName
        return:
          type: string
      - type: method
        name: getCamelName
        return:
          type: string
      - type: method
        name: __construct
        parameters:
          - type: string
            name: chart
          - type: int
            name: time
          - type: float
            name: open
          - type: float
            name: high
          - type: float
            name: low
          - type: float
            name: close
      - type: method
        name: idFor
        parameters:
          - type: string
            name: chart
          - type: int
            name: time
        return:
          type: Uuid
      - type: method
        name: getChart
        return:
          type: string
      - type: method
        name: getTime
        return:
          type: int
      - type: method
        name: getOpen
        return:
          type: float
      - type: method
        name: getHigh
        return:
          type: float
      - type: method
        name: getLow
        return:
          type: float
      - type: method
        name: getClose
        return:
          type: float
      - type: method
        name: getVolume
        return:
          type: float
      - type: method
        name: setVolume
        parameters:
          - type: float
            name: volume
        return:
          type: self
